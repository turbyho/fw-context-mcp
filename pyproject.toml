[project]
name = "fw-context-mcp"
version = "0.19.2"
description = "Build-aware code intelligence MCP server for embedded C/C++ firmware"
requires-python = ">=3.11"
license = {text = "MIT"}
repository = "https://github.com/turbyho/fw-context-mcp"
homepage = "https://github.com/turbyho/fw-context-mcp"
keywords = ["mcp", "mcp-server", "c++", "clang", "embedded", "firmware", "libclang", "sqlite", "fts5", "call-graph", "code-intelligence", "static-analysis", "claude", "llm"]
readme = "README.md"
urls = {Homepage = "https://github.com/turbyho/fw-context-mcp", Documentation = "https://github.com/turbyho/fw-context-mcp#readme", Source = "https://github.com/turbyho/fw-context-mcp", "Issue Tracker" = "https://github.com/turbyho/fw-context-mcp/issues"}

dependencies = [
    "httpx>=0.27.0",
    "libclang>=18.1.1",
    "mcp[cli]>=1.0.0",
    "pysqlite3>=0.5.0",
    "sqlite-vec>=0.1.0",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
cache-server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "asyncpg>=0.29",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
fw-context = "fw_context_mcp.cli:main"
fw-context-mcp = "fw_context_mcp.mcp.server:main"
fw-cache-server = "fw_context_mcp.cache_server.cli:main"
fw-cache-admin = "fw_context_mcp.cache_server.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fw_context_mcp"]
include = [
    "README.md",
    "src/fw_context_mcp/data/**/*.md",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/builds/",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["fw_context_mcp"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
addopts = ["--ignore=tests/test_system_indexing.py"]
testpaths = ["tests"]
markers = [
    "slow: tests that take longer than 2 seconds (full index/reindex via libclang)",
    "ollama: tests that require a running Ollama instance",
    "libclang: tests that require libclang and a C compiler (gcc/clang)",
]
