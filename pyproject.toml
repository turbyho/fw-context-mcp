[project]
name = "fw-context-mcp"
version = "0.1.0"
description = "Local build-aware code intelligence MCP server for embedded projects (Mbed OS, Zephyr)"
requires-python = ">=3.11"
dependencies = [
    "libclang>=18.1.1",
    "mcp[cli]>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
fw-context = "fw_context_mcp.cli:main"
fw-context-mcp = "fw_context_mcp.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fw_context_mcp"]
