[project]
name = "fw-context-mcp"
version = "0.36.0"
description = "Build-aware code intelligence MCP server for embedded C/C++ firmware"
requires-python = ">=3.11"
# MIT for fw-context; Apache-2.0 WITH LLVM-exception for the clang compiler
# headers in data/clang-resource (PEP 639: both licenses go to .dist-info).
license = "MIT AND Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE", "src/fw_context_mcp/data/clang-resource/LICENSE.TXT"]
repository = "https://github.com/turbyho/fw-context-mcp"
homepage = "https://github.com/turbyho/fw-context-mcp"
keywords = ["mcp", "mcp-server", "c++", "clang", "embedded", "firmware", "libclang", "sqlite", "fts5", "call-graph", "code-intelligence", "static-analysis", "claude", "llm"]
readme = "README.md"
urls = {Homepage = "https://github.com/turbyho/fw-context-mcp", Documentation = "https://github.com/turbyho/fw-context-mcp#readme", Source = "https://github.com/turbyho/fw-context-mcp", "Issue Tracker" = "https://github.com/turbyho/fw-context-mcp/issues"}

dependencies = [
    # net.py uses private parts of these two versions (its docstring).
    "httpx>=0.27.0,<1",
    "httpcore>=1.0,<2",
    # The API keys of the LLM profiles go to the keyring of the system
    # (llm/secrets.py): macOS Keychain, Windows Credential Manager, Secret
    # Service on Linux.  MIT; on Linux it adds SecretStorage (BSD-3) and
    # jeepney (MIT).
    "keyring>=24",
    # The ChatGPT plan (llm/chatgpt_plan.py) checks the signature of the
    # ID token of the sign-in against the JWKS of OpenAI.  mcp requires it
    # too; the line names the direct use.  MIT; cryptography: Apache-2.0/BSD.
    "pyjwt[crypto]>=2.10",
    # libclang 22 and its Python binding, in one wheel for Linux, macOS and
    # Windows (x86 and ARM).  WHY not the "libclang" package: its last
    # release is 18.1.1 (2024-03).  An exact pin: the binding and the
    # library must be of one version, and a new major version changes the
    # parse (measure the unit errors before a move).  fw-context ships the
    # clang compiler headers of the same major version (data/clang-resource):
    # the headers of the wheel lack the generated ARM and RISC-V intrinsics.
    # To move, rebuild them with scripts/build_clang_headers.py and move this
    # pin with them.  The two packages install the same "clang" package:
    # never install both.  Apache-2.0 WITH LLVM-exception.
    "libclang-ng==22.1.4.2",
    # <2 is a hard bound, not caution.  mcp 2.x renamed FastMCP to
    # MCPServer and mcp.server.fastmcp now raises ModuleNotFoundError on
    # import, so mcp/server.py does not merely fail to type-check under it
    # — it cannot start.  Upstream says to pin mcp<2 to keep v1 code
    # running.  Lift this together with the migration, not before it.
    "mcp[cli]>=1.0.0,<2",
    # The update check (version_check.py) compares PEP 440 versions, and a
    # string comparison sorts "0.10.0" before "0.9.0".
    "packaging>=23.0",
    "pysqlite3>=0.5.0",
    # Zephyr sysbuild writes the images of a build and the default image
    # into domains.yaml, the file that `west flash` reads too.
    "PyYAML>=6.0",
    "sqlite-vec>=0.1.0",
    "tomli-w>=1.2.0",
    # The cleanup of retired config keys (housekeeping.py) edits a
    # config.toml that is in the git of the user: tomlkit keeps its comments,
    # order and format, and tomli-w writes the file again from the data.
    "tomlkit>=0.13",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
cache-server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "asyncpg>=0.29",
]
st = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
    # tests/test_packaging.py asks the sdist builder which files it selects.
    "hatchling>=1.27",
]

[tool.bandit]
exclude_dirs = ["tests", "experiments"]
# ── Suppressed checks with justifications ──
# B101 (assert_used): assertions guard invariants / type narrowing; not
#   used for security boundary enforcement.
# B404 (import subprocess): build tool must invoke compilers, cmake, bear,
#   git, and other CLI tools — subprocess is essential.
# B603 (subprocess shell): all subprocess.run() calls use the default
#   shell=False; untrusted input never reaches the command arguments.
# B607 (partial path): tools like git, cmake, bear, ninja are expected on
#   PATH in developer environments; absolute paths would break portability.
# B608 (SQL): f-strings only inject parameterized ``?`` placeholders —
#   all user data goes through query parameters, never string interpolation.
# B311 (random): used only in finetune.py for ML training data generation
#   (template sampling, query shuffling, disagreement mining) — no security
#   impact, and SystemRandom would add unnecessary overhead here.
# B105 (password string): false positives — 'unknown' is a sentinel value,
#   '-specs' is a GCC compiler flag, not credentials.
# B108 (tmp dir): uses tempfile.gettempdir(), not raw /tmp string.
skips = ["B101", "B404", "B603", "B607", "B608", "B311", "B105", "B108"]

[project.scripts]
fw-context = "fw_context_mcp.cli:main"
fw-context-mcp = "fw_context_mcp.mcp.server:main"
fw-cache-server = "fw_context_mcp.cache_server.cli:main"
fw-cache-admin = "fw_context_mcp.cache_server.admin:main"

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: PEP 639 license expressions and license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fw_context_mcp"]
include = [
    "README.md",
    "src/fw_context_mcp/data/**/*.md",
    # The list of the models of Ollama (config/_model_list.py).
    "src/fw_context_mcp/data/ollama_models.toml",
    # The clang compiler headers of the pinned libclang major version, with
    # their license and provenance (scripts/build_clang_headers.py).
    "src/fw_context_mcp/data/clang-resource/*",
]

# The sdist holds only the public files. The work material (plans/,
# experiments/ and the files for LLM agents) is in git on the private
# remote, thus .gitignore does not keep it out of the sdist. This list
# does that.
[tool.hatch.build.targets.sdist]
include = [
    "/.dockerignore",
    "/.fw-context/config.toml",
    "/.github",
    "/.gitignore",
    "/.glama",
    "/Dockerfile",
    "/LICENSE",
    "/Makefile",
    "/README-MCP.md",
    "/README.md",
    "/bump.py",
    "/docs",
    "/glama.json",
    "/pyproject.toml",
    "/scripts/build_clang_headers.py",
    "/server.json",
    "/src",
    "/tests",
]
# A folder exclude ends in "/**", not in "/". Hatchling puts these patterns
# after the patterns of .gitignore into one pathspec.GitIgnoreSpec. In it, a
# pattern that matches the file itself has priority over a pattern that
# matches only a parent folder. Thus "!**/.fw-context/config.toml" of
# .gitignore won over "tests/builds/", and each untracked config.toml of
# tests/builds/ went into an sdist of the working tree.
exclude = [
    "tests/builds/**",
    "docs/examples/raw/**",
    "tests/test_feature_comparison.py",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    # One rule from the RUF family, not the family itself: __all__ in
    # utils.py drifted out of order because nothing checked it, and the
    # rest of RUF would drag in findings unrelated to that.
    "RUF022",  # __all__ is not sorted
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["fw_context_mcp"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
addopts = [
    "-m", "not system and not slow and not live",
    "--ignore=tests/builds/mbed_os/mbed-os/tools",
]
testpaths = ["tests"]
markers = [
    "slow: tests that run full indexing and take 30+ minutes — manual invocation only (make test-slow)",
    "ollama: tests that require a running Ollama instance",
    "libclang: tests that require libclang and a C compiler (gcc/clang)",
    "system: tests that require real build tools (gcc/CMake/Make/PlatformIO) and run index on test fixtures",
    "live: functional tests over the indexes that the machine already holds — they depend on local state, thus they run only through make test-live",
    "litellm: tests that require a running LiteLLM proxy at localhost:4000",
]
