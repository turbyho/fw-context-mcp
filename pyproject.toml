[project]
name = "fw-context-mcp"
version = "0.1.0"
description = "Local build-aware code intelligence MCP server for embedded projects (Mbed OS, Zephyr)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "libclang>=18.1.1",
    "mcp[cli]>=1.0.0",
    "sqlite-vec>=0.1.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
]
watch = [
    "watchfiles>=0.21",
]

[project.scripts]
fw-context = "fw_context_mcp.cli:main"
fw-context-mcp = "fw_context_mcp.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fw_context_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["fw_context_mcp"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
