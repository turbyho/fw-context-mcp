; PlatformIO project of the extended set of the test SDKs
; (tests/sdk/versions.toml, marker extra_platforms): Arduino Uno (AVR, 8 bits) with the
; Arduino framework.  The platform is pinned; the platform selects its
; default toolchain and framework.
; `python -m tests.sdk.provision --extra` installs its packages.

[env:uno]
platform = platformio/atmelavr@5.3.0
board = uno
framework = arduino
