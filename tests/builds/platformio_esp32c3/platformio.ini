; PlatformIO project of the test SDKs (tests/sdk/versions.toml): ESP32-C3
; (RISC-V) with the Arduino framework.  The platform is pinned; the
; platform selects its default toolchain and framework.
; `python -m tests.sdk.provision` installs its packages.

[env:esp32c3]
platform = platformio/espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
