# Generated by regenerate.py, not written by hand.
#
# `defined` is what arm-none-eabi-nm reports for the object each
# corpus file assembles to, which is the only authority on what a
# file really defines.  `undefined` is what it names and does not
# define — a vector slot pointing at a linker symbol looks like
# that.  `vectors` comes from the object's relocations.
#
# `complete` says the reader is expected to reproduce `defined`
# exactly.  Where it is false the reader is still forbidden to
# invent: its answer must stay a subset.

[altmacro]
description = 'Alternate macro mode, which the reader refuses rather than guesses at.'
complete = false
defined = ["bracket_delimited", "defined_after", "defined_before"]

[comments]
description = 'Prose and directives inside block comments, which the preprocessor keeps and the reader must skip.'
complete = true
defined = ["after_a_comment_block", "after_a_line_comment", "after_the_long_block", "closed_on_one_line", "code_after_close", "trailing_comment"]

[directives_basic]
description = 'Every directive that names a symbol, with no macro facility involved.'
complete = true
defined = ["a_computed_constant", "a_data_symbol", "a_hex_constant", "a_numeric_constant", "alias_via_equ", "alias_via_set", "alias_via_thumb_set", "an_exported_constant", "declared_after", "has$dollar", "has.period", "plain_local_label", "spelled_global", "spelled_globl", "uses_local_labels", "weak_handler"]

[macro_args]
description = 'Macro argument defaults, :req, :vararg, keyword calls and quoting.'
complete = true
defined = ["both_given_one", "both_given_two", "by_position_0_6", "by_position_1_2", "by_position_3_4", "default_was_overridden", "default_was_used", "first_defaulted", "quotes_were_stripped", "required_was_given", "second_only", "vararg_head"]

[macro_basic]
description = 'The plain .macro forms, and a macro never invoked.'
complete = true
defined = ["POWER_CLOCK_IRQHandler", "RADIO_IRQHandler", "blank_one", "blank_two", "comma_one", "comma_two", "from_no_args", "mixed_one", "mixed_two"]

[macro_control]
description = '.exitm and .purgem.'
complete = true
defined = ["before_exitm", "first_definition", "second_definition"]

[macro_substitution]
description = '\name, \() and \@ inside a body.'
complete = true
defined = ["blank_before_colon", "head_tail", "paren_before_colon", "uses_counters"]

[refuse]
description = 'Constructs an expander must refuse rather than guess at.'
complete = false
defined = ["plain_after", "plain_before", "recursion_target", "taken_branch"]

[repeat]
description = '.rept, .irp and .irpc.'
complete = false
defined = ["irp_alpha", "irp_beta", "irp_gamma", "irp_ran_once", "irpc_1", "irpc_2", "irpc_3", "repeated_data"]

[statements_semicolon]
description = 'Several statements on one line, the shape a C-preprocessor macro expands into.'
complete = true
defined = ["from_gdata", "from_gtext", "from_section_func", "hand_written", "label_first"]

[vector_table]
description = 'A vector table, its reserved slots and its weak aliases of the default handler.'
complete = true
defined = ["Default_Handler", "HardFault_Handler", "NMI_Handler", "Reset_Handler", "SysTick_Handler", "TIM2_IRQHandler", "__Vectors", "legacy_table"]
undefined = ["__StackTop"]
vectors = ["HardFault_Handler", "NMI_Handler", "Reset_Handler", "SysTick_Handler", "TIM2_IRQHandler", "__StackTop"]
