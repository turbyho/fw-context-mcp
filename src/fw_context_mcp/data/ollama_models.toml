# The models of Ollama that fw-context knows, for the list of the models in
# the global config ([llm.models] and [llm.embed_models], see
# config/_model_list.py).  "fw-context init" and "fw-context doctor --fix"
# copy each entry into the global config.  Change this file only with a new
# measurement: the next release updates each entry that the user did not
# change.
#
# [chat]: the models of the LLM analysis.  quality is the blind grade 1-5 of
# the LLM analysis of C/C++ symbols (plans/eval/llm-models-2026-10-20,
# judge/table.json).  The list holds a model when no other model with the
# same or smaller weights is more than 0.2 better (decision of the user,
# 2026-10-21).  A model below 3.0 stays for a machine with little memory.
# A cloud model (remote = true) needs no memory here: the list holds it when
# no other cloud model of the same or a lower price is more than 0.2 better.
# usd_per_1k_symbols is the price of 1000 symbols from the tokens that the
# benchmark measured (a thinking model counts its reasoning), and
# usd_per_1k_symbols_off_peak the price outside 12:00-18:00 UTC on weekdays.
# The rule compares the lower of the two prices.  deepseek-v4.1-flash:cloud
# was graded later, beside 5 graded variants; its grade is on the scale of
# the benchmark from these anchors.
#
# [embedding]: the models of the embeddings.  quality is MRR@10 (0-1) of the
# search of 105 queries with a known target symbol on one firmware project
# (plans/eval/embed-models-2026-10-21, fm_table.py), with the query
# instruction that fw-context gives each model.  WHY one project: an
# external model got only the code of that project (decision of the user,
# 2026-10-22), and each model is on the same scale.  It is not on the scale
# of the chat models.  An external model (remote = true) names its provider
# (an API profile of that provider: [llm] embed_profile) and its price for
# one million tokens (the OpenRouter model list of 2026-10-22).
#
# weights_gb: the size of the model file that Ollama pulled on Linux with
# an NVIDIA GPU (ollama list), in GB of 10^9 bytes; ollama.com/library for a
# model that the benchmark did not pull.  One tag can resolve to another
# file on another platform (mlx, nvfp4): the size is a guide, and the
# calibration measures the memory of the machine.  dimension: the embedding_length of /api/show.  A
# value that no source gives is left out.

