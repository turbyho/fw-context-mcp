# Tests on Windows.
#
# The project must support Linux and macOS (test.yml runs them on each push),
# and Windows where it can.  Windows is not supported yet: the file locks
# (fcntl), the daemon socket (AF_UNIX) and the process groups (killpg) use
# POSIX calls, thus mypy and the tests fail.  This workflow runs only when it
# is started by hand (Actions > Test (Windows) > Run workflow).  When the suite
# passes on Windows, move windows-latest into the matrix of test.yml.
name: Test (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: ruff check src/
      - run: mypy src/
      # Unpack the bundled clang compiler headers, as `fw-context init` does
      # on a user host.
      - run: fw-context doctor --fix --only clang-resource
        continue-on-error: true
      - run: pytest tests/ -q -m "not ollama and not libclang and not slow and not system"
